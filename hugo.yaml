  homeInfoParams:
    Title: "Qualia Radiomics 👋"
    Content: |
      **Computational Healthcare & Oncology Informatics (CHOI) Lab**
      at Sidney Kimmel Medical College, Thomas Jefferson University,
      led by **[Wookjin Choi, Ph.D.](/profile/)**

      We develop **interpretable AI and open-source radiomics tools** (including our flagship **[QRadiomics CLI](/qradiomics/)**) for medical imaging — quantitative image analysis, radiomics, and deep learning for cancer diagnosis, radiation therapy planning, and outcome prediction. New to the field? Start with **[medimage](/posts/2026-08-04-introducing-medimage/)**, our free hands-on Colab course.

      **Focus areas:** Lung cancer screening · Cardiotoxicity prediction (Cardiac PET radiomics) ·
      MR-guided adaptive radiotherapy (MRI-Linac) · Pancreatic / hepatic / head-and-neck cancer imaging ·
      Interpretable deep learning (PathCNN, CIRDataset, Spiculation).

      → [**About the Lab**](/about/) · [**QRadiomics CLI**](/qradiomics/) · [**medimage Course**](/posts/2026-08-04-introducing-medimage/) · [**Blog & News**](/posts/) · [**Director Profile**](/profile/)

