baseURL: "https://qradiomics.com/"
languageCode: "en-us"
title: "Qualia Radiomics"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: monokai
    lineNos: false

ignoreLogs:
  - warning-goldmark-raw-html

minify:
  disableXML: true
  minifyOutput: true

pagination:
  pagerSize: 10

params:
  env: production
  title: "Qualia Radiomics"
  description: "Medical Imaging, Quantitative Image Analysis, Computer-Aided Diagnosis, Machine Learning"
  keywords: [Radiomics, Medical Imaging, Lung Cancer, Deep Learning, AI, Radiation Therapy]
  author: "Wookjin Choi"
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true
  TocOpen: false

  homeInfoParams:
    Title: "Qualia Radiomics"
    Content: >
      Medical Imaging, Quantitative Image Analysis, Computer-Aided Diagnosis, Machine Learning.
      Research by Wookjin Choi, Ph.D., Assistant Professor of Radiation Oncology,
      Sidney Kimmel Medical College at Thomas Jefferson University.

  socialIcons:
    - name: github
      url: "https://github.com/taznux"
    - name: linkedin
      url: "https://www.linkedin.com/in/wookjin-choi-5309a325/"
    - name: researchgate
      url: "https://www.researchgate.net/profile/Wookjin_Choi2"
    - name: googlescholar
      url: "https://scholar.google.com/citations?user=iHgsGLUAAAAJ"
    - name: orcid
      url: "https://orcid.org/0000-0001-8038-5876"
    - name: email
      url: "mailto:Wookjin.Choi@jefferson.edu"

  assets:
    disableHLJS: false
    favicon: "/favicon.ico"

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 20
    - identifier: profile
      name: Profile
      url: /profile/
      weight: 30
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  category: categories
  tag: tags
