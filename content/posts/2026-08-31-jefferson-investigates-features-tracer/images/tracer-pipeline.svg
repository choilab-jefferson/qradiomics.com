<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'DejaVu Sans',Verdana,Arial,sans-serif"><rect width="1200" height="630" fill="#f7f9fc"/><text x="60" y="84" font-size="40" font-weight="700" fill="#1b2430">TRACER: cardiac events from EHR text</text><text x="60" y="124" font-size="24" fill="#4a5565">Open-source LLMs with a prompting framework, 411-patient cohort</text><rect x="60" y="170" width="300" height="170" rx="14" fill="#fff" stroke="#4a5565" stroke-width="3"/><text x="210" y="225" font-size="28" font-weight="700" fill="#1b2430" text-anchor="middle">Unstructured</text><text x="210" y="262" font-size="26" font-weight="400" fill="#1b2430" text-anchor="middle">electronic health</text><text x="210" y="296" font-size="26" font-weight="400" fill="#1b2430" text-anchor="middle">records</text><line x1="365" y1="255" x2="435" y2="255" stroke="#4a5565" stroke-width="4"/><polygon points="435,255 421,246 421,264" fill="#4a5565"/><rect x="440" y="170" width="320" height="170" rx="14" fill="#fff" stroke="#1f5fbf" stroke-width="3"/><text x="600" y="225" font-size="28" font-weight="700" fill="#1f5fbf" text-anchor="middle">Open-source LLM</text><text x="600" y="262" font-size="26" font-weight="400" fill="#1b2430" text-anchor="middle">plus TRACER</text><text x="600" y="296" font-size="26" font-weight="400" fill="#1b2430" text-anchor="middle">prompting framework</text><line x1="765" y1="255" x2="835" y2="255" stroke="#4a5565" stroke-width="4"/><polygon points="835,255 821,246 821,264" fill="#4a5565"/><rect x="840" y="170" width="300" height="170" rx="14" fill="#fff" stroke="#0f7a6b" stroke-width="3"/><text x="990" y="225" font-size="28" font-weight="700" fill="#0f7a6b" text-anchor="middle">Cardiac events</text><text x="990" y="262" font-size="26" font-weight="400" fill="#1b2430" text-anchor="middle">extracted from</text><text x="990" y="296" font-size="26" font-weight="400" fill="#1b2430" text-anchor="middle">patient charts</text><text x="60" y="402" font-size="24" font-weight="700" fill="#1b2430" text-anchor="start">Time per chart</text><rect x="60" y="420" width="540" height="150" rx="14" fill="#fff" stroke="#b3541e" stroke-width="3"/><text x="330" y="465" font-size="26" font-weight="700" fill="#b3541e" text-anchor="middle">Manual review</text><text x="330" y="535" font-size="46" font-weight="700" fill="#1b2430" text-anchor="middle">about 2 hours</text><rect x="640" y="420" width="500" height="150" rx="14" fill="#fff" stroke="#0f7a6b" stroke-width="3"/><text x="890" y="465" font-size="26" font-weight="700" fill="#0f7a6b" text-anchor="middle">LLM pipeline</text><text x="890" y="535" font-size="46" font-weight="700" fill="#1b2430" text-anchor="middle">20 to 42 seconds</text></svg>