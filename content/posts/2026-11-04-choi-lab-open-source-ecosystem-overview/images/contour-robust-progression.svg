<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Overcoming Contour Dependency in Radiomics: Three-Tier Strategy</title>
  <desc id="desc">Progression from automated contour QC and TG-263 RAG-LLM standardization to spatial-temporal denoising and direct diagnostic-to-treatment contour-free AI.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b1f24"/>
      <stop offset="1" stop-color="#20262d"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a313a"/>
      <stop offset="1" stop-color="#222830"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="460" rx="16" fill="url(#bg2)"/>

  <text x="50" y="58" fill="#f39800" font-size="14" font-weight="700" letter-spacing="1.6">SOLVING CLASSICAL RADIOMICS&apos; BIGGEST BOTTLENECK</text>
  <text x="50" y="94" fill="#eef0f2" font-size="28" font-weight="700">Three-Tier Progression Beyond Manual Contour Dependency</text>

  <!-- Tier 1 (x=50..380, width=330; text x=74, max width=282) -->
  <g>
    <rect x="50" y="132" width="330" height="248" rx="16" fill="url(#cardGrad2)" stroke="#3a4149" stroke-width="1.5"/>
    <text x="74" y="172" fill="#60a5fa" font-size="12" font-weight="700" letter-spacing="1.2">TIER 1 · CONTOUR HYGIENE &amp; QC</text>
    <text x="74" y="202" fill="#eef0f2" font-size="21" font-weight="700">Audit &amp; Harmonize</text>
    <line x1="74" y1="220" x2="356" y2="220" stroke="#3a4149" stroke-width="1"/>
    <text x="74" y="250" fill="#c9cdd3" font-size="13.5">• qr longitudinal contour QC</text>
    <text x="74" y="278" fill="#c9cdd3" font-size="13.5">• TG-263 RAG-LLM ROI naming</text>
    <text x="74" y="306" fill="#c9cdd3" font-size="13.5">• Multi-reader ICC stability gate</text>
    <text x="74" y="346" fill="#8b9198" font-size="12.5">Filters contour jitter before modeling</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g stroke="#f39800" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="392" y1="256" x2="424" y2="256"/>
    <polyline points="416,247 426,256 416,265"/>
  </g>

  <!-- Tier 2 (x=435..765, width=330; text x=459, max width=282) -->
  <g>
    <rect x="435" y="132" width="330" height="248" rx="16" fill="url(#cardGrad2)" stroke="#3a4149" stroke-width="1.5"/>
    <text x="459" y="172" fill="#f39800" font-size="12" font-weight="700" letter-spacing="1.2">TIER 2 · ROBUST FEATURES</text>
    <text x="459" y="202" fill="#eef0f2" font-size="21" font-weight="700">Denoise &amp; Pool</text>
    <line x1="459" y1="220" x2="741" y2="220" stroke="#3a4149" stroke-width="1"/>
    <text x="459" y="250" fill="#c9cdd3" font-size="13.5">• Spatial-temporal CBCT denoising</text>
    <text x="459" y="278" fill="#c9cdd3" font-size="13.5">• 3D shape (AHSN, spic6)</text>
    <text x="459" y="306" fill="#c9cdd3" font-size="13.5">• CT-FM subspace pooling</text>
    <text x="459" y="346" fill="#8b9198" font-size="12.5">ASTRO 2026 Award · AAPM SNAP Oral</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g stroke="#f39800" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="777" y1="256" x2="809" y2="256"/>
    <polyline points="801,247 811,256 801,265"/>
  </g>

  <!-- Tier 3 (x=820..1150, width=330; text x=844, max width=282) -->
  <g>
    <rect x="820" y="132" width="330" height="248" rx="16" fill="url(#cardGrad2)" stroke="#10b981" stroke-width="2"/>
    <text x="844" y="172" fill="#10b981" font-size="12" font-weight="700" letter-spacing="1.2">TIER 3 · CONTOUR-FREE AI</text>
    <text x="844" y="202" fill="#eef0f2" font-size="21" font-weight="700">Diagnostic-to-Dose AI</text>
    <line x1="844" y1="220" x2="1126" y2="220" stroke="#3a4149" stroke-width="1"/>
    <text x="844" y="250" fill="#c9cdd3" font-size="13.5">• Direct SBRT dose prediction from</text>
    <text x="844" y="272" fill="#c9cdd3" font-size="13.5">  diagnostic PET/CT scans</text>
    <text x="844" y="302" fill="#c9cdd3" font-size="13.5">• Automated cardiac PET uptake</text>
    <text x="844" y="346" fill="#8b9198" font-size="12.5">No manual simulation contours needed</text>
  </g>

  <!-- Footer -->
  <line x1="50" y1="406" x2="1150" y2="406" stroke="#3a4149" stroke-width="1"/>
  <text x="50" y="434" fill="#8b9198" font-size="14">CHOI Lab · Department of Radiation Oncology · Thomas Jefferson University</text>
  <text x="1150" y="434" fill="#8b9198" font-size="14" text-anchor="end">qradiomics.com/ecosystem/</text>
</svg>
